services:
  db:
    # RU: точная версия, а не mysql:8. Плавающий тег однажды приведёт не туда,
    #     а Django 6.1 отказывается работать с MySQL ниже 8.4.
    # EN: a pinned version rather than mysql:8. A floating tag will eventually
    #     land somewhere else, and Django 6.1 refuses MySQL below 8.4.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    volumes:
      # RU: именованный том, а не ./db:/var/lib/mysql. Bind mount с
      #     Windows-хоста ломает MySQL правами доступа, и данными управляет
      #     сам Docker, а не файловая система хоста.
      # EN: a named volume rather than ./db:/var/lib/mysql. A bind mount from a
      #     Windows host breaks MySQL on permissions, and Docker — not the host
      #     filesystem — manages the data.
      - mysql_data:/var/lib/mysql
    # RU: порт наружу НЕ публикуем: на EC2 это была бы база в интернете.
    #     Внутри сети Compose сервисы видят друг друга по имени через
    #     встроенный DNS (тема 24).
    # EN: the port is NOT published: on EC2 that would be a database exposed to
    #     the internet. Inside the Compose network services reach each other by
    #     name through the built-in DNS.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # RU: env_file вместо перечисления переменных. Пароли в открытом виде
    #     в docker-compose.yml — это пароли в Git.
    # EN: env_file instead of listing variables. Plain-text passwords in
    #     docker-compose.yml are passwords in Git.
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      IN_CONTAINER: "True"
    volumes:
      # RU: общие тома с nginx: загруженные фото и собранная статика.
      #     Без тома для media фотографии исчезнут при пересоздании контейнера.
      # EN: volumes shared with nginx: uploaded photos and collected static.
      #     Without the media volume, photos vanish when the container is recreated.
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        # RU: service_healthy, а не просто depends_on. Обычный depends_on ждёт
        #     лишь запуска контейнера, а не готовности СУБД принимать
        #     соединения — именно поэтому в исходнике стоял sleep 15 (тема 25).
        # EN: service_healthy rather than a bare depends_on. A plain depends_on
        #     waits only for the container to start, not for the database to
        #     accept connections — which is why the original had sleep 15.
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  mysql_data:
  media_files:
  static_files: