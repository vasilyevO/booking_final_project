services:
  db:
    # a pinned version rather than mysql:8. A floating tag will eventually
    # land somewhere else, and Django 6.1 refuses MySQL below 8.4.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
#    ports:
#      - "3306:3306"
    volumes:
      # a named volume rather than ./db:/var/lib/mysql. A bind mount from a
      # Windows host breaks MySQL on permissions, and Docker — not the host
      # filesystem — manages the data.
      - mysql_data:/var/lib/mysql
    # the port is not published: on EC2 that would be a database exposed to
    # the internet. Inside the Compose network services reach each other by
    # name through the built-in DNS.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost",
             "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # env_file instead of listing variables. Plain-text passwords in
    # docker-compose.yml are passwords in Git.
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      IN_CONTAINER: "True"
    volumes:
      # volumes shared with nginx: uploaded photos and collected static.
      # Without the media volume, photos vanish when the container is recreated.
      - media_files:/app/media
      - static_files:/app/staticfiles
    depends_on:
      db:
        # service_healthy rather than a bare depends_on. A plain depends_on
        # waits only for the container to start, not for the database to
        # accept connections.
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/app/media:ro
      - static_files:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  mysql_data:
  media_files:
  static_files: